[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "qa-agent"
version = "0.1.0"
description = "QA Agent: Outline + GitHub PR → Gherkin test cases"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "deepagents>=0.2.0",
    "langchain>=0.3.0",
    "langchain-openai>=0.3.0",
    "httpx>=0.28.0",
    "python-dotenv>=1.0.0",
    "typer>=0.15.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "rich>=13.0.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
graphify = ["graphifyy>=0.1.0"]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.24.0", "httpx>=0.28.0"]

[project.scripts]
qa-agent = "qa_agent.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/qa_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
